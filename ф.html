<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мафия · Комната</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        body {
            background: #0f0f1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        
        .card {
            width: 100%;
            max-width: 600px;
            background: #1a1a2a;
            border-radius: 48px;
            padding: 32px;
            border: 2px solid #ffd700;
            box-shadow: 0 25px 50px -12px #000;
        }
        
        /* Экран входа */
        .join {
            text-align: center;
        }
        
        .join h1 {
            color: #ffd700;
            font-size: 4rem;
            margin-bottom: 40px;
            text-shadow: 0 0 30px #ffd700;
        }
        
        .join input {
            width: 100%;
            padding: 20px 24px;
            background: #25253a;
            border: 2px solid #ffd700;
            border-radius: 60px;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 24px;
            outline: none;
        }
        
        .join input:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 20px #ffd700;
        }
        
        .join button {
            width: 100%;
            padding: 20px;
            background: #ffd700;
            border: none;
            border-radius: 60px;
            color: #0f0f1a;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .join button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px #ffd700;
        }
        
        /* Комната */
        .room {
            animation: show 0.3s;
        }
        
        @keyframes show {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #25253a;
            padding: 16px 24px;
            border-radius: 60px;
            margin-bottom: 32px;
        }
        
        .header h2 {
            color: #ffd700;
            font-size: 1.8rem;
        }
        
        .code {
            background: #ffd700;
            padding: 10px 24px;
            border-radius: 60px;
            color: #0f0f1a;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
        
        .players {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            margin: 32px 0;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            padding: 8px;
        }
        
        .player {
            background: #25253a;
            border-radius: 30px;
            padding: 20px 12px;
            text-align: center;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        
        .player.admin {
            border-color: #ffd700;
            box-shadow: 0 0 20px #ffd70040;
        }
        
        .player.you {
            border-color: #4caf50;
        }
        
        .avatar {
            width: 60px;
            height: 60px;
            background: #ffd70020;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 2rem;
            color: #ffd700;
        }
        
        .name {
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .badge-admin {
            background: #ffd70020;
            color: #ffd700;
        }
        
        .badge-you {
            background: #4caf5020;
            color: #4caf50;
        }
        
        .info {
            text-align: center;
            color: #888;
            margin: 20px 0 10px;
            font-size: 1rem;
        }
        
        .hidden {
            display: none;
        }
        
        .share {
            margin-top: 24px;
            padding: 20px;
            background: #25253a;
            border-radius: 30px;
            text-align: center;
            border: 2px dashed #ffd700;
        }
        
        .share p {
            color: #ffd700;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }
        
        .share-link {
            background: #0f0f1a;
            color: white;
            padding: 15px;
            border-radius: 30px;
            word-break: break-all;
            font-size: 0.9rem;
            border: 1px solid #ffd700;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Экран входа -->
        <div id="joinScreen" class="join">
            <h1>🎭 МАФИЯ</h1>
            <input type="text" id="playerName" placeholder="Твой ник" value="Игрок">
            <button onclick="joinRoom()">🚪 Войти в комнату</button>
        </div>

        <!-- Экран комнаты -->
        <div id="roomScreen" class="room hidden">
            <div class="header">
                <h2>Комната</h2>
                <div class="code" id="roomCode">MAFIA</div>
            </div>
            
            <div class="players" id="playersList"></div>
            
            <div class="info" id="playerCount">Игроков: 0</div>
            <div class="info" id="adminStatus"></div>
            
            <div class="share">
                <p>📱 Отправь ссылку друзьям:</p>
                <div class="share-link" id="shareLink">Загрузка...</div>
            </div>
        </div>
    </div>

    <script>
        // ========== ДАННЫЕ ==========
        let players = [];
        let myId = null;
        let roomId = 'mafia_' + Math.random().toString(36).substr(2, 8);
        
        // ========== ВХОД ==========
        window.joinRoom = function() {
            let name = document.getElementById('playerName').value.trim();
            if (name === '') name = 'Игрок';
            
            // Первый игрок = админ
            const isAdmin = players.length === 0;
            
            // Создаем игрока
            const newPlayer = {
                id: 'p' + Date.now() + Math.random().toString(36).substr(2, 5),
                name: name,
                isAdmin: isAdmin
            };
            
            players.push(newPlayer);
            myId = newPlayer.id;
            
            // Сохраняем в localStorage
            localStorage.setItem('mafia_players', JSON.stringify(players));
            localStorage.setItem('mafia_myid', myId);
            
            // Переключаем экраны
            document.getElementById('joinScreen').classList.add('hidden');
            document.getElementById('roomScreen').classList.remove('hidden');
            
            // Обновляем интерфейс
            updateRoom();
            updateShareLink();
        };
        
        // ========== ОБНОВЛЕНИЕ КОМНАТЫ ==========
        function updateRoom() {
            const container = document.getElementById('playersList');
            container.innerHTML = '';
            
            players.forEach((player, index) => {
                const card = document.createElement('div');
                card.className = `player ${player.isAdmin ? 'admin' : ''} ${player.id === myId ? 'you' : ''}`;
                
                let badge = '';
                if (player.isAdmin) badge = '<span class="badge badge-admin">👑 Админ</span>';
                else if (player.id === myId) badge = '<span class="badge badge-you">⭐ Вы</span>';
                
                card.innerHTML = `
                    <div class="avatar">${index + 1}</div>
                    <div class="name">${player.name}</div>
                    ${badge}
                `;
                container.appendChild(card);
            });
            
            // Обновляем счетчик
            document.getElementById('playerCount').innerHTML = `👥 Игроков: ${players.length}`;
            
            // Статус админа
            const currentPlayer = players.find(p => p.id === myId);
            if (currentPlayer && currentPlayer.isAdmin) {
                document.getElementById('adminStatus').innerHTML = '👑 Ты админ (ты первый)';
            } else {
                document.getElementById('adminStatus').innerHTML = '⭐ Ты обычный игрок';
            }
        }
        
        // ========== ССЫЛКА ДЛЯ ДРУЗЕЙ ==========
        function updateShareLink() {
            const url = window.location.href;
            document.getElementById('shareLink').innerText = url;
        }
        
        // ========== ЗАГРУЗКА СОХРАНЕННЫХ ИГРОКОВ ==========
        function loadSaved() {
            const saved = localStorage.getItem('mafia_players');
            const savedId = localStorage.getItem('mafia_myid');
            
            if (saved && savedId) {
                players = JSON.parse(saved);
                myId = savedId;
                
                // Проверяем, есть ли текущий игрок в списке
                const stillHere = players.some(p => p.id === myId);
                if (stillHere) {
                    document.getElementById('joinScreen').classList.add('hidden');
                    document.getElementById('roomScreen').classList.remove('hidden');
                    updateRoom();
                    updateShareLink();
                } else {
                    // Если нет - очищаем
                    localStorage.removeItem('mafia_players');
                    localStorage.removeItem('mafia_myid');
                }
            }
        }
        
        // ========== ОБНОВЛЕНИЕ КАЖДУЮ СЕКУНДУ (для синхронизации) ==========
        setInterval(() => {
            // В реальном приложении здесь должен быть WebSocket
            // Но для теста просто сохраняем в localStorage
            if (players.length > 0) {
                localStorage.setItem('mafia_players', JSON.stringify(players));
            }
            
            // Проверяем, не добавил ли кто-то новых игроков
            const saved = localStorage.getItem('mafia_players');
            if (saved) {
                const savedPlayers = JSON.parse(saved);
                // Если появились новые игроки
                if (savedPlayers.length > players.length) {
                    players = savedPlayers;
                    updateRoom();
                }
            }
        }, 1000);
        
        // Загружаем при старте
        loadSaved();
    </script>
</body>
</html>
