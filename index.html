<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МАФИЯ · ОБЩАЯ КОМНАТА</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
        body { background: #0a0f1f; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .card { width: 100%; max-width: 500px; background: #16213e; border-radius: 50px; padding: 32px; border: 3px solid gold; }
        .join { text-align: center; }
        .join h1 { color: gold; font-size: 4rem; margin-bottom: 40px; }
        .join input { width: 100%; padding: 18px; background: #1a1f35; border: 2px solid gold; border-radius: 40px; color: white; font-size: 1.2rem; text-align: center; margin-bottom: 20px; }
        .join button { width: 100%; padding: 18px; background: gold; border: none; border-radius: 40px; color: black; font-size: 1.3rem; font-weight: bold; cursor: pointer; }
        .room { animation: fade 0.3s; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        .header { display: flex; justify-content: space-between; background: #1a1f35; padding: 15px 20px; border-radius: 40px; margin-bottom: 25px; }
        .header h2 { color: gold; }
        .code { background: gold; padding: 8px 20px; border-radius: 40px; color: black; }
        .list { min-height: 200px; margin: 20px 0; }
        .person { background: #1a1f35; border-radius: 40px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; border: 2px solid transparent; }
        .person.admin { border-color: gold; }
        .person.you { border-color: #4caf50; }
        .num { width: 45px; height: 45px; background: gold; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; font-weight: bold; }
        .name { flex: 1; color: white; font-weight: bold; }
        .tag { padding: 4px 15px; border-radius: 30px; font-size: 0.9rem; }
        .tag.admin { background: gold; color: black; }
        .tag.you { background: #4caf50; color: white; }
        .info { text-align: center; color: white; margin: 10px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div id="joinBlock" class="join">
            <h1>МАФИЯ</h1>
            <input type="text" id="nameField" value="Игрок">
            <button onclick="join()">🚪 Войти</button>
        </div>

        <div id="roomBlock" class="room hidden">
            <div class="header">
                <h2>КТО В КОМНАТЕ</h2>
                <div class="code" id="roomCode">MAFIA</div>
            </div>
            <div class="list" id="list"></div>
            <div class="info" id="count">👥 0</div>
        </div>
    </div>

    <script>
        // ========== СОХРАНЯЕМ ВСЕХ В ОБЩЕМ ХРАНИЛИЩЕ ==========
        const MY_ID = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        let players = [];
        
        // Загружаем список
        function loadPlayers() {
            let saved = localStorage.getItem('mafia_global_list');
            if (saved) {
                try {
                    players = JSON.parse(saved);
                } catch(e) {
                    players = [];
                }
            }
        }
        
        // Сохраняем список
        function savePlayers() {
            localStorage.setItem('mafia_global_list', JSON.stringify(players));
        }
        
        // Обновляем экран
        function updateList() {
            let html = '';
            players.sort((a,b) => a.isAdmin ? -1 : 1).forEach((p, i) => {
                let tag = '';
                if (p.isAdmin) tag += '<span class="tag admin">👑 Админ</span>';
                if (p.id === MY_ID) tag += '<span class="tag you">⭐ Вы</span>';
                html += `<div class="person ${p.isAdmin ? 'admin' : ''} ${p.id === MY_ID ? 'you' : ''}">
                    <div class="num">${i+1}</div>
                    <div class="name">${p.name}</div>
                    ${tag}
                </div>`;
            });
            document.getElementById('list').innerHTML = html;
            document.getElementById('count').innerHTML = `👥 Сейчас в комнате: ${players.length}`;
        }
        
        // Вход
        window.join = function() {
            let name = document.getElementById('nameField').value || 'Игрок';
            
            loadPlayers();
            
            // Удаляем тех, кто не обновлялся 5 секунд
            let fiveSecondsAgo = Date.now() - 5000;
            players = players.filter(p => (p.lastSeen || 0) > fiveSecondsAgo);
            
            // Проверяем, есть ли я
            let iExist = players.find(p => p.id === MY_ID);
            
            if (!iExist) {
                let amAdmin = players.length === 0;
                players.push({
                    id: MY_ID,
                    name: name,
                    isAdmin: amAdmin,
                    lastSeen: Date.now()
                });
            } else {
                iExist.lastSeen = Date.now();
            }
            
            savePlayers();
            
            document.getElementById('joinBlock').classList.add('hidden');
            document.getElementById('roomBlock').classList.remove('hidden');
            updateList();
        };
        
        // Каждую секунду обновляем
        setInterval(() => {
            if (!document.getElementById('roomBlock').classList.contains('hidden')) {
                loadPlayers();
                
                // Удаляем старых
                let fiveSecondsAgo = Date.now() - 5000;
                let before = players.length;
                players = players.filter(p => (p.lastSeen || 0) > fiveSecondsAgo);
                
                // Обновляем свое время
                let me = players.find(p => p.id === MY_ID);
                if (me) {
                    me.lastSeen = Date.now();
                }
                
                if (before !== players.length || me) {
                    savePlayers();
                    updateList();
                }
            }
        }, 1000);
        
        // Загрузка при старте
        loadPlayers();
        if (players.find(p => p.id === MY_ID)) {
            document.getElementById('joinBlock').classList.add('hidden');
            document.getElementById('roomBlock').classList.remove('hidden');
            updateList();
        }
    </script>
</body>
</html>
